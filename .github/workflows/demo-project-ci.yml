name: Examples CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DemoProject
            solution: examples/DemoProject/DemoProject.sln
            test_project: examples/DemoProject/tests/DemoProject.Tests/DemoProject.Tests.csproj
          - name: MinimalApi
            solution: examples/DemoProject.MinimalApi/DemoProject.MinimalApi.slnx
            test_project: examples/DemoProject.MinimalApi/tests/DemoProject.MinimalApi.Tests/DemoProject.MinimalApi.Tests.csproj

    name: ${{ matrix.name }} — Build & Test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      # GUARDRAIL: The build must pass with warnings treated as errors
      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore --configuration Release -p:TreatWarningsAsErrors=true

      # GUARDRAIL: dotnet test is dangerous — we use dotnet run --project
      # GUARDRAIL: Verify that the tests actually ran (not 0 ran)
      # Single source of test-running logic: ci/scripts/run-and-verify-tests.sh
      - name: Run Tests + Verify
        run: bash ci/scripts/run-and-verify-tests.sh ${{ matrix.test_project }}

  traps-guardrails:
    runs-on: ubuntu-latest
    name: Traps — Guardrails Must Catch

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore examples/DemoProject/DemoProject.sln

      # GUARDRAIL: The build must pass with warnings treated as errors
      - name: Build
        run: dotnet build examples/DemoProject/DemoProject.sln --no-restore --configuration Release -p:TreatWarningsAsErrors=true

      # GUARDRAIL: Traps — deliberately broken code. The tests MUST fail.
      # If the tests pass, the guardrails are broken and the traps are no longer caught.
      - name: Run Traps Tests (Expect Failure)
        run: bash ci/scripts/run-and-verify-tests.sh examples/DemoProject/tests/DemoProject.Traps.Tests/DemoProject.Traps.Tests.csproj --expect-failure

  repo-quality:
    runs-on: ubuntu-latest
    name: Repo Quality (docs & skills)

    steps:
      - uses: actions/checkout@v4

      - name: Markdown link check
        run: bash ci/scripts/check-links.sh

      - name: Skill schema check
        run: bash ci/scripts/check-skills.sh

      - name: Knowledge-map completeness
        run: bash ci/scripts/check-knowledge-map.sh

      - name: Guardrail lifecycle (suppressions, decision guards)
        run: bash ci/scripts/check-guardrail-lifecycle.sh
